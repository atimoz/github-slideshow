<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Timer - Leaderboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="title">Work Timer</h1>
            <p class="subtitle">Mesure ton temps de travail</p>
        </header>

        <!-- Main Timer Section -->
        <section class="timer-section">
            <div class="timer-display">
                <div class="time-container">
                    <div class="time" id="timerDisplay">
                        <span class="hours" id="hours">00</span>
                        <span class="separator">:</span>
                        <span class="minutes" id="minutes">00</span>
                        <span class="separator">:</span>
                        <span class="seconds" id="seconds">00</span>
                    </div>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="controls">
                <button class="btn btn-primary" id="startBtn">
                    <span class="btn-icon">▶</span>
                    <span class="btn-text">Démarrer</span>
                </button>
                <button class="btn btn-secondary" id="pauseBtn" disabled>
                    <span class="btn-icon">⏸</span>
                    <span class="btn-text">Pause</span>
                </button>
                <button class="btn btn-tertiary" id="resetBtn">
                    <span class="btn-icon">↻</span>
                    <span class="btn-text">Réinitialiser</span>
                </button>
            </div>

            <!-- Save Session Button -->
            <div class="session-actions">
                <button class="btn btn-save" id="saveSessionBtn" disabled>
                    <span class="btn-icon">✓</span>
                    Enregistrer la session
                </button>
            </div>
        </section>

        <!-- Graph Section -->
        <section class="graph-section">
            <h3 class="section-title">📊 Progression</h3>
            <div class="graph-container">
                <svg class="graph-svg" id="graphChart" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <linearGradient id="graphGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#007AFF;stop-opacity:0.2" />
                            <stop offset="100%" style="stop-color:#007AFF;stop-opacity:0.01" />
                        </linearGradient>
                    </defs>
                    <!-- Grid lines -->
                    <line x1="0" y1="50" x2="100" y2="50" stroke="#E5E5EA" stroke-width="0.2"/>
                    <!-- Graph line will be inserted here -->
                    <polyline class="graph-line" points="" fill="url(#graphGradient)" stroke="#007AFF" stroke-width="0.8"/>
                </svg>
            </div>
            <div class="graph-legend">
                <span class="legend-day" id="day1">L</span>
                <span class="legend-day" id="day2">M</span>
                <span class="legend-day" id="day3">M</span>
                <span class="legend-day" id="day4">J</span>
                <span class="legend-day" id="day5">V</span>
                <span class="legend-day" id="day6">S</span>
                <span class="legend-day" id="day7">D</span>
            </div>
        </section>

        <!-- Leaderboard Tabs -->
        <section class="leaderboard-section">
            <div class="tabs">
                <button class="tab-btn active" data-tab="week">
                    <span class="tab-icon">📅</span>
                    Cette semaine
                </button>
                <button class="tab-btn" data-tab="month">
                    <span class="tab-icon">📆</span>
                    Ce mois
                </button>
            </div>

            <!-- Leaderboard Content -->
            <div class="leaderboard-content">
                <div class="leaderboard" id="weekLeaderboard">
                    <div class="leaderboard-empty">
                        <p>Aucune session cette semaine</p>
                        <span class="empty-icon">🏃</span>
                    </div>
                </div>
                <div class="leaderboard hidden" id="monthLeaderboard">
                    <div class="leaderboard-empty">
                        <p>Aucune session ce mois</p>
                        <span class="empty-icon">🏃</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Stats -->
        <section class="stats-section">
            <div class="stat-card">
                <span class="stat-label">Total semaine</span>
                <span class="stat-value" id="weekTotal">0h 0m</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Total mois</span>
                <span class="stat-value" id="monthTotal">0h 0m</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Sessions</span>
                <span class="stat-value" id="sessionCount">0</span>
            </div>
        </section>

        <!-- Goals Section -->
        <section class="goals-section">
            <h3 class="section-title">🎯 Objectifs</h3>
            <div class="goals-container">
                <div class="goal-item">
                    <div class="goal-header">
                        <span class="goal-name">Par jour</span>
                        <input type="number" class="goal-input" id="dailyGoal" value="8" min="1" max="24">
                        <span class="goal-unit">h</span>
                    </div>
                    <div class="goal-progress" id="dailyProgress">
                        <div class="progress-bar">
                            <div class="progress-fill" id="dailyFill" style="width: 0%"></div>
                        </div>
                        <span class="progress-text" id="dailyText">0 / 8h</span>
                    </div>
                </div>
                <div class="goal-item">
                    <div class="goal-header">
                        <span class="goal-name">Par semaine</span>
                        <input type="number" class="goal-input" id="weeklyGoal" value="40" min="1" max="168">
                        <span class="goal-unit">h</span>
                    </div>
                    <div class="goal-progress" id="weeklyProgress">
                        <div class="progress-bar">
                            <div class="progress-fill" id="weeklyFill" style="width: 0%"></div>
                        </div>
                        <span class="progress-text" id="weeklyText">0 / 40h</span>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
