<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Timer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #86868b;
    --accent: #0071e3;
    --accent-light: #e8f2ff;
    --green: #34c759;
    --green-light: #e8fae9;
    --orange: #ff9f0a;
    --orange-light: #fff5e0;
    --red: #ff3b30;
    --border: #e5e5ea;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
    --radius: 16px;
    --radius-sm: 12px;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 24px 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .header h1 {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .header-right {
    position: absolute;
    right: 16px;
  }
  .header-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 0 8px;
  }
  .settings-btn {
    background: var(--card);
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    font-size: 20px;
    transition: all 0.2s;
  }
  .settings-btn:hover { background: var(--bg); transform: scale(1.05); }
  .subtitle {
    text-align: center;
    color: var(--text-secondary);
    font-size: 15px;
    margin-bottom: 8px;
  }

  /* Timer Card */
  .timer-card {
    background: var(--card);
    border-radius: 20px;
    padding: 40px 24px 32px;
    text-align: center;
    box-shadow: var(--shadow-lg);
    margin: 24px 0;
    position: relative;
    overflow: hidden;
  }
  .timer-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent), #a855f7, var(--red));
    opacity: 0;
    transition: opacity 0.4s;
  }
  .timer-card.running::before { opacity: 1; }

  .timer-display {
    font-size: 64px;
    font-weight: 200;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin-bottom: 8px;
    transition: color 0.3s;
  }
  .timer-card.running .timer-display { color: var(--accent); }

  .timer-label {
    font-size: 13px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 500;
    margin-bottom: 28px;
  }

  .timer-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .btn {
    border: none;
    border-radius: 980px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 32px;
  }
  .btn:active { transform: scale(0.96); }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: #0077ed; }
  .btn-primary.running {
    background: var(--red);
  }
  .btn-primary.running:hover { background: #e0332b; }

  .btn-secondary {
    background: var(--accent-light);
    color: var(--accent);
  }
  .btn-secondary:hover { background: #d8eaff; }

  .btn-icon {
    width: 20px;
    height: 20px;
  }

  /* Today Stats */
  .today-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .stat-card .stat-value {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .stat-card .stat-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
    font-weight: 500;
  }
  .stat-card.green .stat-value { color: var(--green); }
  .stat-card.accent .stat-value { color: var(--accent); }

  /* Session Log */
  .section-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 12px;
    letter-spacing: -0.3px;
  }

  .sessions-log {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 24px;
    overflow: hidden;
  }
  .session-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .session-item:last-child { border-bottom: none; }
  .session-time {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .session-duration {
    font-size: 15px;
    font-weight: 600;
  }
  .empty-state {
    padding: 32px 20px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
  }

  /* Chart Tabs */
  .tabs {
    display: flex;
    background: rgba(0,0,0,0.04);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 16px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    border: none;
    background: none;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.25s;
    font-family: inherit;
  }
  .tab.active {
    background: var(--card);
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  /* Chart */
  .chart-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 24px;
  }
  .chart-card canvas {
    width: 100%;
    height: 200px;
  }
  .chart-summary {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .chart-summary-item {
    text-align: center;
  }
  .chart-summary-value {
    font-size: 18px;
    font-weight: 700;
  }
  .chart-summary-label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* Progress Bar */
  .progress-wrapper {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
  }
  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .progress-title {
    font-weight: 600;
    font-size: 15px;
  }
  .progress-value {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .progress-bar {
    height: 8px;
    background: var(--bg);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), #a855f7);
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .progress-fill.over {
    background: linear-gradient(90deg, var(--green), #2ebd4e);
  }

  /* Modal / Settings */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    padding: 20px;
  }
  .modal-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .modal {
    background: var(--card);
    border-radius: 20px;
    padding: 28px 24px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    transform: scale(0.95);
    transition: transform 0.25s;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-overlay.show .modal {
    transform: scale(1);
  }
  .modal h3 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 20px;
  }

  .setting-group {
    margin-bottom: 20px;
  }
  .setting-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .setting-input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .setting-input:focus { border-color: var(--accent); }
  .setting-hint {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }
  .modal-actions .btn { flex: 1; justify-content: center; padding: 12px 20px; }
  .btn-ghost {
    background: none;
    color: var(--text-secondary);
  }
  .btn-ghost:hover { background: var(--bg); }
  .btn-danger {
    background: rgba(255,59,48,0.1);
    color: var(--red);
    font-size: 14px;
    padding: 12px 20px;
    width: 100%;
    justify-content: center;
    margin-top: 8px;
  }
  .btn-danger:hover { background: rgba(255,59,48,0.15); }

  /* Name Input */
  .name-setup {
    text-align: center;
    padding: 60px 20px;
  }
  .name-setup h2 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .name-setup p {
    color: var(--text-secondary);
    margin-bottom: 28px;
    font-size: 15px;
  }
  .name-setup input {
    width: 100%;
    max-width: 300px;
    padding: 14px 20px;
    border: 1.5px solid var(--border);
    border-radius: 980px;
    font-family: inherit;
    font-size: 16px;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 16px;
  }
  .name-setup input:focus { border-color: var(--accent); }

  /* Delete button */
  .session-delete {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    font-size: 16px;
    opacity: 0;
    transition: all 0.15s;
  }
  .session-item:hover .session-delete { opacity: 1; }
  .session-delete:hover { color: var(--red); background: rgba(255,59,48,0.08); }

  @media (max-width: 400px) {
    .timer-display { font-size: 52px; }
    .stat-card .stat-value { font-size: 24px; }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .timer-card.running .timer-label {
    animation: pulse 2s ease-in-out infinite;
    color: var(--accent);
  }
</style>
</head>
<body>

<div class="app" id="app"></div>

<script>
// ─── Data Layer ───
const STORAGE_KEY = 'workTimerData';
const SETTINGS_KEY = 'workTimerSettings';

function loadData() {
  const d = localStorage.getItem(STORAGE_KEY);
  return d ? JSON.parse(d) : { currentUser: null, sessions: [] };
}

function saveData(d) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
}

function loadSettings() {
  const s = localStorage.getItem(SETTINGS_KEY);
  return s ? JSON.parse(s) : { goalDay: 8, goalWeek: 40, goalYear: 1800 };
}

function saveSettings(s) {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
}

function getWeekKey(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(d.setDate(diff));
  return `${monday.getFullYear()}-W${String(Math.ceil((monday.getDate()) / 7 + 1)).padStart(2, '0')}-${monday.getMonth()}`;
}

function getTodayKey(date) {
  const d = new Date(date || Date.now());
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDuration(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function formatHours(ms) {
  const h = ms / 3600000;
  if (h < 0.1) return `${Math.round(ms/60000)}m`;
  return `${h.toFixed(1)}h`;
}

function formatTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

// ─── App State ───
let data = loadData();
let settings = loadSettings();
let timerStart = null;
let timerInterval = null;
let elapsed = 0;
let chartTab = 'day';
let showSettings = false;

// Migrate old data format: remove fake users, keep only current user sessions
if (data.users) {
  const user = data.currentUser;
  if (user) {
    data.sessions = data.sessions.filter(s => s.user === user);
  }
  delete data.users;
  saveData(data);
}

// ─── Render ───
function render() {
  const app = document.getElementById('app');
  if (!data.currentUser) {
    app.innerHTML = renderSetup();
    const input = app.querySelector('#nameInput');
    if (input) {
      input.focus();
      input.addEventListener('keydown', e => { if (e.key === 'Enter') startWithName(); });
    }
    return;
  }
  app.innerHTML = `
    ${renderHeader()}
    ${renderTimer()}
    ${renderTodayStats()}
    ${renderGoals()}
    <h2 class="section-title">Statistiques</h2>
    ${renderChartTabs()}
    ${renderChart()}
    <h2 class="section-title">Sessions du jour</h2>
    ${renderTodaySessions()}
    ${showSettings ? renderSettingsModal() : ''}
  `;
  bindEvents();
  requestAnimationFrame(() => drawChart());
}

function renderSetup() {
  return `
    <div class="name-setup">
      <h2>Work Timer</h2>
      <p>Entrez votre nom pour commencer a<br>suivre votre temps de travail</p>
      <input type="text" id="nameInput" placeholder="Votre nom" maxlength="30">
      <br>
      <button class="btn btn-primary" onclick="startWithName()">Commencer</button>
    </div>
  `;
}

function startWithName() {
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if (!name) return;
  data.currentUser = name;
  saveData(data);
  render();
}

function renderHeader() {
  return `
    <div class="header-wrapper">
      <div style="text-align:center">
        <h1 style="font-size:34px;font-weight:700;letter-spacing:-0.5px">Work Timer</h1>
      </div>
      <div class="header-right">
        <button class="settings-btn" onclick="showSettings=true;render()" title="Parametres">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>
    <div class="subtitle">Bonjour, ${data.currentUser.split(' ')[0]} !</div>
  `;
}

function renderTimer() {
  const isRunning = timerStart !== null;
  return `
    <div class="timer-card ${isRunning ? 'running' : ''}">
      <div class="timer-display">${formatDuration(elapsed)}</div>
      <div class="timer-label">${isRunning ? 'En cours...' : 'Pret'}</div>
      <div class="timer-buttons">
        <button class="btn btn-primary ${isRunning ? 'running' : ''}" id="toggleBtn">
          ${isRunning
            ? '<svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor"><rect x="5" y="4" width="10" height="12" rx="1.5"/></svg>Arreter'
            : '<svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor"><polygon points="6,3 17,10 6,17"/></svg>Demarrer'}
        </button>
        ${!isRunning && elapsed === 0 ? '' : !isRunning ? `
          <button class="btn btn-secondary" id="resetBtn">Reinit.</button>
        ` : ''}
      </div>
    </div>
  `;
}

function renderTodayStats() {
  const today = getTodayKey();
  const todaySessions = data.sessions.filter(s => getTodayKey(s.start) === today);
  const totalToday = todaySessions.reduce((a, s) => a + s.duration, 0);
  const count = todaySessions.length;
  return `
    <div class="today-stats">
      <div class="stat-card green">
        <div class="stat-value">${formatHours(totalToday + elapsed)}</div>
        <div class="stat-label">Aujourd'hui</div>
      </div>
      <div class="stat-card accent">
        <div class="stat-value">${count + (timerStart ? 1 : 0)}</div>
        <div class="stat-label">Sessions</div>
      </div>
    </div>
  `;
}

function renderGoals() {
  const today = getTodayKey();
  const todayTotal = data.sessions.filter(s => getTodayKey(s.start) === today).reduce((a,s) => a+s.duration, 0) + elapsed;
  const dayPct = Math.min(100, (todayTotal / (settings.goalDay * 3600000)) * 100);

  const weekKey = getWeekKey(Date.now());
  const weekTotal = data.sessions.filter(s => getWeekKey(s.start) === weekKey).reduce((a,s) => a+s.duration, 0) + elapsed;
  const weekPct = Math.min(100, (weekTotal / (settings.goalWeek * 3600000)) * 100);

  const year = new Date().getFullYear();
  const yearTotal = data.sessions.filter(s => new Date(s.start).getFullYear() === year).reduce((a,s) => a+s.duration, 0) + elapsed;
  const yearPct = Math.min(100, (yearTotal / (settings.goalYear * 3600000)) * 100);

  function bar(title, current, goal, pct) {
    const over = current >= goal * 3600000;
    return `
      <div class="progress-wrapper">
        <div class="progress-header">
          <span class="progress-title">${title}</span>
          <span class="progress-value">${formatHours(current)} / ${goal}h</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill ${over ? 'over' : ''}" style="width:${pct}%"></div>
        </div>
      </div>
    `;
  }

  return bar('Objectif jour', todayTotal, settings.goalDay, dayPct)
       + bar('Objectif semaine', weekTotal, settings.goalWeek, weekPct)
       + bar('Objectif annee', yearTotal, settings.goalYear, yearPct);
}

function renderChartTabs() {
  return `
    <div class="tabs">
      <button class="tab ${chartTab==='day'?'active':''}" onclick="chartTab='day';render()">Journee</button>
      <button class="tab ${chartTab==='week'?'active':''}" onclick="chartTab='week';render()">Semaine</button>
      <button class="tab ${chartTab==='year'?'active':''}" onclick="chartTab='year';render()">Annee</button>
    </div>
  `;
}

function renderChart() {
  const { labels, values, total, avg } = getChartData();
  return `
    <div class="chart-card">
      <canvas id="statsChart" height="200"></canvas>
      <div class="chart-summary">
        <div class="chart-summary-item">
          <div class="chart-summary-value" style="color:var(--accent)">${formatHours(total)}</div>
          <div class="chart-summary-label">Total</div>
        </div>
        <div class="chart-summary-item">
          <div class="chart-summary-value" style="color:var(--green)">${formatHours(avg)}</div>
          <div class="chart-summary-label">Moyenne</div>
        </div>
        <div class="chart-summary-item">
          <div class="chart-summary-value">${values.filter(v => v > 0).length}</div>
          <div class="chart-summary-label">${chartTab === 'year' ? 'Mois actifs' : chartTab === 'week' ? 'Jours actifs' : 'Heures actives'}</div>
        </div>
      </div>
    </div>
  `;
}

function getChartData() {
  const now = new Date();
  let labels = [], values = [];

  if (chartTab === 'day') {
    // Hours of the day (0h-23h)
    const today = getTodayKey();
    const todaySessions = data.sessions.filter(s => getTodayKey(s.start) === today);
    for (let h = 0; h < 24; h++) {
      labels.push(`${h}h`);
      let total = 0;
      todaySessions.forEach(s => {
        const start = new Date(s.start);
        const end = new Date(s.start + s.duration);
        // Overlap with this hour slot
        const slotStart = new Date(start); slotStart.setHours(h, 0, 0, 0);
        const slotEnd = new Date(start); slotEnd.setHours(h + 1, 0, 0, 0);
        const overlapStart = Math.max(s.start, slotStart.getTime());
        const overlapEnd = Math.min(s.start + s.duration, slotEnd.getTime());
        if (overlapEnd > overlapStart) total += overlapEnd - overlapStart;
      });
      // Add current running session overlap
      if (timerStart) {
        const slotStart = new Date(now); slotStart.setHours(h, 0, 0, 0);
        const slotEnd = new Date(now); slotEnd.setHours(h + 1, 0, 0, 0);
        const overlapStart = Math.max(timerStart, slotStart.getTime());
        const overlapEnd = Math.min(Date.now(), slotEnd.getTime());
        if (overlapEnd > overlapStart) total += overlapEnd - overlapStart;
      }
      values.push(total);
    }
  } else if (chartTab === 'week') {
    // Days of the week (Lun-Dim)
    const dayNames = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
    const weekKey = getWeekKey(Date.now());
    // Find Monday of current week
    const d = new Date(now);
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    const monday = new Date(d);
    monday.setDate(diff);
    monday.setHours(0, 0, 0, 0);

    for (let i = 0; i < 7; i++) {
      const dayDate = new Date(monday);
      dayDate.setDate(monday.getDate() + i);
      const dayKey = getTodayKey(dayDate.getTime());
      labels.push(dayNames[i]);
      let total = data.sessions.filter(s => getTodayKey(s.start) === dayKey).reduce((a, s) => a + s.duration, 0);
      // Add current elapsed for today
      if (dayKey === getTodayKey() && timerStart) total += elapsed;
      values.push(total);
    }
  } else {
    // Months of the year
    const monthNames = ['Jan', 'Fev', 'Mar', 'Avr', 'Mai', 'Jun', 'Jul', 'Aou', 'Sep', 'Oct', 'Nov', 'Dec'];
    const year = now.getFullYear();
    for (let m = 0; m < 12; m++) {
      labels.push(monthNames[m]);
      let total = data.sessions.filter(s => {
        const sd = new Date(s.start);
        return sd.getFullYear() === year && sd.getMonth() === m;
      }).reduce((a, s) => a + s.duration, 0);
      // Add current elapsed for current month
      if (m === now.getMonth() && timerStart) total += elapsed;
      values.push(total);
    }
  }

  const total = values.reduce((a, v) => a + v, 0);
  const nonZero = values.filter(v => v > 0).length;
  const avg = nonZero > 0 ? total / nonZero : 0;

  return { labels, values, total, avg };
}

function drawChart() {
  const canvas = document.getElementById('statsChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const { labels, values } = getChartData();
  const w = rect.width;
  const h = rect.height;
  const padding = { top: 20, right: 10, bottom: 30, left: 10 };
  const chartW = w - padding.left - padding.right;
  const chartH = h - padding.top - padding.bottom;

  const maxVal = Math.max(...values, 1);
  const barCount = labels.length;
  const gap = chartTab === 'year' ? 6 : chartTab === 'week' ? 8 : 2;
  const barW = (chartW - gap * (barCount - 1)) / barCount;

  ctx.clearRect(0, 0, w, h);

  // Goal line
  let goalMs = 0;
  if (chartTab === 'day') goalMs = settings.goalDay * 3600000 / 24;
  else if (chartTab === 'week') goalMs = settings.goalWeek * 3600000 / 7;
  else goalMs = settings.goalYear * 3600000 / 12;

  const maxDisplay = Math.max(maxVal, goalMs);

  if (goalMs > 0) {
    const goalY = padding.top + chartH - (goalMs / maxDisplay) * chartH;
    ctx.strokeStyle = 'rgba(255, 59, 48, 0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(padding.left, goalY);
    ctx.lineTo(w - padding.right, goalY);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Bars
  const accentRGB = [0, 113, 227];
  const greenRGB = [52, 199, 89];

  labels.forEach((label, i) => {
    const x = padding.left + i * (barW + gap);
    const val = values[i];
    const barH = maxDisplay > 0 ? (val / maxDisplay) * chartH : 0;
    const y = padding.top + chartH - barH;

    // Bar
    const isOverGoal = goalMs > 0 && val >= goalMs;
    const gradient = ctx.createLinearGradient(x, y, x, padding.top + chartH);
    if (isOverGoal) {
      gradient.addColorStop(0, `rgba(${greenRGB.join(',')}, 0.9)`);
      gradient.addColorStop(1, `rgba(${greenRGB.join(',')}, 0.4)`);
    } else {
      gradient.addColorStop(0, `rgba(${accentRGB.join(',')}, 0.9)`);
      gradient.addColorStop(1, `rgba(${accentRGB.join(',')}, 0.4)`);
    }
    ctx.fillStyle = gradient;

    const radius = Math.min(barW / 2, 4);
    if (barH > 0) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + barW - radius, y);
      ctx.quadraticCurveTo(x + barW, y, x + barW, y + radius);
      ctx.lineTo(x + barW, padding.top + chartH);
      ctx.lineTo(x, padding.top + chartH);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.fill();
    }

    // Label
    ctx.fillStyle = '#86868b';
    ctx.font = `500 ${chartTab === 'day' ? 9 : 11}px Inter, sans-serif`;
    ctx.textAlign = 'center';
    // Show fewer labels for day view
    if (chartTab === 'day') {
      if (i % 3 === 0) ctx.fillText(label, x + barW / 2, h - 6);
    } else {
      ctx.fillText(label, x + barW / 2, h - 6);
    }
  });
}

function renderTodaySessions() {
  const today = getTodayKey();
  const todaySessions = data.sessions
    .filter(s => getTodayKey(s.start) === today)
    .sort((a, b) => b.start - a.start);

  if (todaySessions.length === 0) {
    return `<div class="sessions-log"><div class="empty-state">Aucune session aujourd'hui</div></div>`;
  }
  return `
    <div class="sessions-log">
      ${todaySessions.map((s) => `
        <div class="session-item">
          <div>
            <div class="session-duration">${formatHours(s.duration)}</div>
            <div class="session-time">${formatTime(s.start)} - ${formatTime(s.start + s.duration)}</div>
          </div>
          <button class="session-delete" onclick="deleteSession(${data.sessions.indexOf(s)})">&#10005;</button>
        </div>
      `).join('')}
    </div>
  `;
}

function renderSettingsModal() {
  return `
    <div class="modal-overlay show" onclick="if(event.target===this){showSettings=false;render()}">
      <div class="modal">
        <h3>Parametres</h3>

        <div class="setting-group">
          <div class="setting-label">Objectif journalier (heures)</div>
          <input class="setting-input" type="number" id="goalDay" value="${settings.goalDay}" min="0" max="24" step="0.5">
        </div>

        <div class="setting-group">
          <div class="setting-label">Objectif hebdomadaire (heures)</div>
          <input class="setting-input" type="number" id="goalWeek" value="${settings.goalWeek}" min="0" max="168" step="1">
        </div>

        <div class="setting-group">
          <div class="setting-label">Objectif annuel (heures)</div>
          <input class="setting-input" type="number" id="goalYear" value="${settings.goalYear}" min="0" max="8760" step="10">
        </div>

        <div class="setting-group">
          <div class="setting-label">Votre nom</div>
          <input class="setting-input" type="text" id="settingsName" value="${data.currentUser}" maxlength="30">
        </div>

        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="showSettings=false;render()">Annuler</button>
          <button class="btn btn-primary" onclick="saveSettingsForm()">Enregistrer</button>
        </div>

        <button class="btn btn-danger" onclick="if(confirm('Supprimer toutes les donnees ?')){localStorage.clear();location.reload()}">
          Reinitialiser toutes les donnees
        </button>
      </div>
    </div>
  `;
}

// ─── Actions ───
function toggleTimer() {
  if (timerStart) {
    const duration = Date.now() - timerStart;
    data.sessions.push({ start: timerStart, duration });
    saveData(data);
    timerStart = null;
    elapsed = 0;
    clearInterval(timerInterval);
    timerInterval = null;
  } else {
    timerStart = Date.now();
    elapsed = 0;
    timerInterval = setInterval(() => {
      elapsed = Date.now() - timerStart;
      render();
    }, 1000);
  }
  render();
}

function resetTimer() {
  timerStart = null;
  elapsed = 0;
  clearInterval(timerInterval);
  timerInterval = null;
  render();
}

function deleteSession(idx) {
  data.sessions.splice(idx, 1);
  saveData(data);
  render();
}

function saveSettingsForm() {
  const goalDay = parseFloat(document.getElementById('goalDay').value) || 8;
  const goalWeek = parseFloat(document.getElementById('goalWeek').value) || 40;
  const goalYear = parseFloat(document.getElementById('goalYear').value) || 1800;
  const name = document.getElementById('settingsName').value.trim();

  settings.goalDay = Math.max(0, Math.min(24, goalDay));
  settings.goalWeek = Math.max(0, Math.min(168, goalWeek));
  settings.goalYear = Math.max(0, Math.min(8760, goalYear));
  saveSettings(settings);

  if (name && name !== data.currentUser) {
    data.currentUser = name;
    saveData(data);
  }

  showSettings = false;
  render();
}

function bindEvents() {
  const toggleBtn = document.getElementById('toggleBtn');
  if (toggleBtn) toggleBtn.addEventListener('click', toggleTimer);
  const resetBtn = document.getElementById('resetBtn');
  if (resetBtn) resetBtn.addEventListener('click', resetTimer);
}

// ─── Init ───
render();
window.addEventListener('resize', () => { requestAnimationFrame(drawChart); });
</script>
